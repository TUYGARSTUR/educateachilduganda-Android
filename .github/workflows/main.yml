name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          if [ -f "build.gradle" ] && [ -d "app" ]; then
            echo "Android project found in repository root"
            gradle :app:assembleDebug
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "Android project ZIP found: $ZIP_FILE"
              mkdir -p android-project
              unzip -q "$ZIP_FILE" -d android-project

              PROJECT_DIR=$(find android-project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

              echo "Project directory: $PROJECT_DIR"
              cd "$PROJECT_DIR"
              gradle :app:assembleDebug
            else
              echo "ERROR: Android project or ZIP file was not found."
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EducateAChildUganda-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
